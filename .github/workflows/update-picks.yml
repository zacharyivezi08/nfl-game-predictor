name: Update picks page

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes, all week
  workflow_dispatch:         # adds a "Run workflow" button to run it anytime

permissions:
  contents: write

# Never run two updates at once (a slow run finishes before the next one starts)
concurrency:
  group: update-picks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Reuse downloaded data from past runs (only this season gets re-downloaded)
        uses: actions/cache@v4
        with:
          path: data
          key: nfl-data-${{ github.run_id }}
          restore-keys: nfl-data-

      - run: pip install -r requirements.txt

      - name: Pull latest results + injury reports, retrain, rebuild page
        run: |
          python src/train.py --refresh
          python src/build_site.py

      - name: Save the new page (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Nothing changed since the last run."
          else
            git commit -m "Auto-update picks $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
