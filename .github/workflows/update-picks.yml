name: Update picks page

on:
  schedule:
    # GitHub uses UTC. Two lines per time so it stays right before AND after
    # daylight saving ends (EDT = UTC-4 until Nov 1, EST = UTC-5 after).
    - cron: "0 23 * * 3"    # Wed 7:00 PM EDT
    - cron: "0 0 * * 4"     # Wed 7:00 PM EST
    - cron: "30 16 * * 0"   # Sun 12:30 PM EDT
    - cron: "30 17 * * 0"   # Sun 12:30 PM EST
    - cron: "30 19 * * 0"   # Sun 3:30 PM EDT
    - cron: "30 20 * * 0"   # Sun 3:30 PM EST
    - cron: "30 23 * * 0"   # Sun 7:30 PM EDT
    - cron: "30 0 * * 1"    # Sun 7:30 PM EST
  workflow_dispatch:         # adds a "Run workflow" button to run it anytime

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Reuse downloaded data from past runs (only this season gets re-downloaded)
        uses: actions/cache@v4
        with:
          path: data
          key: nfl-data-${{ github.run_id }}
          restore-keys: nfl-data-

      - run: pip install -r requirements.txt

      - name: Pull latest results, retrain, rebuild page
        run: |
          python src/train.py --refresh
          python src/build_site.py

      - name: Save the new page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Auto-update picks $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
